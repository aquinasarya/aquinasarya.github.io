<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selected work · Thomas Arya</title>
<meta name="description" content="A project by Thomas Arya, product designer in Jakarta.">
<meta name="theme-color" content="#0A1230">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="pbar">
  <a href="index.html#work"><span aria-hidden="true">←</span> All work</a>
  <a href="index.html"><b>thomasarya</b>™</a>
  <a href="index.html#contact">Contact</a>
</header>
<main id="page"></main>
<footer class="footer">
  <span><b>thomasarya</b>™ · Selected Works 2026</span>
  <span>Jakarta, Indonesia</span>
  <a href="#">Back to top ↑</a>
</footer>
<dialog class="lightbox" id="lightbox" aria-label="Picture viewer">
  <div class="lb-stage"><img src="" alt=""></div>
  <button class="lb-close" type="button" aria-label="Close">×</button>
  <button class="lb-prev" type="button" aria-label="Previous picture">←</button>
  <button class="lb-next" type="button" aria-label="Next picture">→</button>
  <span class="lb-count"></span>
</dialog>
<script src="data.js"></script>
<script src="data2.js"></script>
<script src="shared.js"></script>
<script>
(() => {
  const D = window.DATA, { esc, cover, player, reveal, FX } = window.TA;
  const k = new URLSearchParams(location.search).get('k');
  let i = D.projects.findIndex((p) => p.id === k); if (i < 0) i = 0;
  const p = D.projects[i], n = D.projects[(i + 1) % D.projects.length];
  document.title = `${p.name} · Thomas Arya`;
  const mail = `mailto:aquinasarya@gmail.com?subject=${encodeURIComponent('Case study request: ' + p.name)}`;
  // A shot is a file name, or [file, title, caption]
  const fig = (x, alt, n) => { const src = Array.isArray(x) ? x[0] : x, t = Array.isArray(x) ? x[1] : '', c = Array.isArray(x) ? x[2] : ''; return `<figure class="pfig reveal"><button type="button" class="zoom" data-src="img/${src}.jpg" aria-label="View ${esc(t || alt)} full screen"><img src="img/${src}.jpg" alt="${esc(t || alt)}" loading="lazy"></button>${t ? `<figcaption><span>${String(n).padStart(2, '0')}</span><b>${esc(t)}</b>${esc(c)}</figcaption>` : ''}</figure>`; };
  const figs = (list, from, cols) => list.length ? `<div class="pfigs n${cols || Math.min(list.length, 3)}">${list.map((x, j) => fig(x, `${p.name} screen ${from + j + 1}`, from + j + 1)).join('')}</div>` : '';
  const im = p.shots || p.imgs, ph = p.phone, lead = im.slice(0, ph ? 3 : 1), mid = im.slice(ph ? 3 : 1, ph ? 5 : 3), rest = im.slice(ph ? 5 : 3);
  const locked = `<div class="locked reveal"><p class="kick" style="margin:0">Under confidentiality</p><h3>Screens, flows and the design system are shared in a private walkthrough.</h3><p>This is client work. I can show the real modules, the information architecture before and after, and the component library on a call.</p><a class="btn btn-ink" href="${mail}"><span>Request a walkthrough</span><i aria-hidden="true">→</i></a></div>`;
  document.getElementById('page').innerHTML = `
  <article class="pw${p.phone ? ' phone' : ''}">
    <a class="pback" href="index.html#work"><span aria-hidden="true">←</span> Back to all work</a>
    <div class="pcover reveal">${cover(p)}</div>
    <header class="phead">
      <h1>${esc(p.name)}</h1>
      <p class="sub">${esc(p.sub)}</p>
      <div class="ptags"><span>My role: <b>${esc(p.role)}</b></span><span>${esc(p.type)}</span><span>${esc(p.field)}</span><span>${esc(p.time)}</span></div>
    </header>
    <section class="pblock">
      <h2>What it is</h2>
      ${p.hook ? `<p class="phook">${esc(p.hook)}</p>` : ''}
      <p>${esc(p.about)}</p>
      ${p.shotsNote ? `<p class="pnote">${esc(p.shotsNote)}</p>` : ''}
      ${im.length ? figs(lead, 0) : locked}
    </section>
    <section class="pblock">
      <h2>What I did</h2>
      <blockquote>${esc(p.statement)}</blockquote>
      <ol class="steps">${p.steps.map((s, j) => `<li><span>0${j + 1}</span>${esc(s)}</li>`).join('')}</ol>
      ${figs(mid, lead.length)}
    </section>
    <section class="pblock">
      <h2>What changed</h2>
      <div class="impact">${p.impacts.map((x) => `<article class="reveal"><b>${esc(x[0])}</b><p>${esc(x[1])}</p></article>`).join('')}</div>
    </section>
    ${p.yt ? `<section class="pblock"><h2>See it in use</h2><div class="reveal">${player(p.yt, p.ytStart, '', p.ytPoster)}</div></section>` : ''}
    ${p.vids ? `<section class="pblock"><h2>See it in use</h2><div class="vids">${p.vids.map((v, j) => `<figure class="reveal${j === 0 ? ' big' : ''}"><video src="media/${v[0]}.mp4" poster="media/${v[0]}.jpg" ${j === 0 ? 'autoplay' : 'controls preload="none"'} muted loop playsinline></video><figcaption>${esc(v[1])}</figcaption></figure>`).join('')}</div></section>` : ''}
    ${rest.length || p.stills ? `<section class="pblock"><h2>${p.shots ? 'Screen by screen' : 'More screens'}</h2>${figs(rest, lead.length + mid.length, ph ? 3 : p.shots ? 2 : 0)}${p.stills ? `<div class="pfigs n2">${p.stills.map((x) => fig(x, p.name + ' video still', 0)).join('')}</div><p class="pnote">Stills from the video.</p>` : ''}</section>` : ''}
    <div class="pcta">
      ${p.url ? `<a class="btn btn-ink" href="${esc(p.url)}" target="_blank" rel="noopener"><span>${esc(p.cta)}</span><i aria-hidden="true">↗</i></a>` : ''}
      <a class="btn btn-ink" href="${mail}"><span>Ask for the full case study</span><i aria-hidden="true">→</i></a>
    </div>
  </article>
  <section class="section dark pnext-band" style="overflow:hidden;isolation:isolate">${FX}
    <div class="pnext">
      <div><p class="kick">Next project</p><h2>${esc(n.name)}</h2><p class="section-sub" style="margin:0 0 28px">${esc(n.sub)}</p>
        <a class="btn" href="work.html?k=${n.id}"><span>Open project</span><i aria-hidden="true">→</i></a></div>
      <a href="work.html?k=${n.id}" aria-label="${esc(n.name)}">${cover(n)}</a>
    </div>
  </section>`;
  reveal();

  // Full-screen viewer for the pictures in "A closer look"
  const lb = document.getElementById('lightbox'), lbImg = lb.querySelector('img'), lbCount = lb.querySelector('.lb-count');
  const zooms = [...document.querySelectorAll('.zoom')]; let at = 0;
  const showAt = (n) => { at = (n + zooms.length) % zooms.length; lbImg.src = zooms[at].dataset.src; lbImg.alt = zooms[at].querySelector('img').alt; lbCount.textContent = `${at + 1} / ${zooms.length}`; lb.classList.toggle('single', zooms.length < 2); };
  zooms.forEach((z, n) => z.addEventListener('click', () => { showAt(n); lb.showModal(); }));
  lb.querySelector('.lb-prev').addEventListener('click', () => showAt(at - 1));
  lb.querySelector('.lb-next').addEventListener('click', () => showAt(at + 1));
  lb.querySelector('.lb-close').addEventListener('click', () => lb.close());
  lb.addEventListener('click', (e) => { if (e.target === lb || e.target.classList.contains('lb-stage')) lb.close(); });
  lb.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') showAt(at - 1); if (e.key === 'ArrowRight') showAt(at + 1); });
})();
</script>
</body>
</html>
